<!doctype html>
<html lang="hi">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/icons/kisan-icon-512.png" />
    <link rel="icon" type="image/svg+xml" href="/icons/kisan-icon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    
    <!-- Primary SEO & App Identity -->
    <title>किसान साथी - फसल से बिक्री तक | Kisan Saathi</title>
    <meta name="description" content="बुआई पूर्व, मौसम, खाद कैलकुलेटर, रोग निदान, कृषक उन्नति योजना और लाइव मंडी भाव - किसानों का ऑल-इन-वन समाधान।" />
    
    <!-- PWA & Mobile Web App Meta -->
    <link rel="manifest" href="/manifest.json" />
    <meta name="theme-color" content="#134e19" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="किसान साथी" />
    <link rel="apple-touch-icon" href="/icons/kisan-icon-512.png" />

    <!-- Google Fonts for crisp Hindi and English typography -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Mukta:wght@400;500;600;700;800&family=Roboto:wght@300;400;500;700&display=swap" rel="stylesheet">
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>

    <!-- Service Worker Registration with Instant Cache Eviction & Auto-Update -->
    <script>
      if ('serviceWorker' in navigator) {
        window.addEventListener('load', () => {
          navigator.serviceWorker.register('/sw.js', { updateViaCache: 'none' })
            .then((reg) => {
              console.log('[PWA] Service Worker active:', reg.scope);
              // Proactively check for newer SW release on every visit
              reg.update();

              // When a new SW is found & installed, prepare reload
              reg.addEventListener('updatefound', () => {
                const installingWorker = reg.installing;
                if (installingWorker) {
                  installingWorker.addEventListener('statechange', () => {
                    if (installingWorker.state === 'installed' && navigator.serviceWorker.controller) {
                      console.log('[PWA] New version ready. Applying update...');
                    }
                  });
                }
              });
            })
            .catch((err) => {
              console.warn('[PWA] Service Worker registration failed:', err);
            });

          // Smoothly reload once the new Service Worker activates and claims clients
          let isRefreshing = false;
          navigator.serviceWorker.addEventListener('controllerchange', () => {
            if (!isRefreshing) {
              isRefreshing = true;
              console.log('[PWA] Controller changed, reloading to display latest version.');
              window.location.reload();
            }
          });
        });
      }
    </script>
  </body>
</html>
