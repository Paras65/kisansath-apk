    <!-- PWA Self-Healing: Instant Stale Cache & Chunk Load Error Recovery -->
    <script>
      window.addEventListener('error', function(event) {
        var msg = (event && event.message) || '';
        var isScriptError = (event && event.target && event.target.tagName === 'SCRIPT');
        var isMimeOrChunk = msg.indexOf('MIME type') !== -1 ||
                            msg.indexOf('Failed to load module script') !== -1 ||
                            msg.indexOf('Loading chunk') !== -1;
        if (isMimeOrChunk || isScriptError) {
          console.warn('[PWA Self-Healing] Stale script or MIME error detected:', msg);
          var healKey = 'kisan_sw_healed_' + Math.floor(Date.now() / 30000);
          if (!sessionStorage.getItem(healKey)) {
            sessionStorage.setItem(healKey, '1');
            if ('caches' in window) {
              caches.keys().then(function(names) {
                return Promise.all(names.map(function(name) { return caches.delete(name); }));
              }).then(function() {
                if ('serviceWorker' in navigator) {
                  navigator.serviceWorker.getRegistrations().then(function(regs) {
                    regs.forEach(function(r) { r.unregister(); });
                    window.location.reload();
                  });
                } else {
                  window.location.reload();
                }
              });
            } else {
              window.location.reload();
            }
          }
        }
      }, true);
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>

    <!-- Service Worker Registration with Instant Cache Eviction & Auto-Update -->
    <script>
      if ('serviceWorker' in navigator) {
        window.addEventListener('load', () => {
          navigator.serviceWorker.register('/sw.js', { updateViaCache: 'none' })
            .then((reg) => {
              console.log('[PWA] Service Worker active:', reg.scope);
              // Proactively check for newer SW release on every visit
              reg.update();

              // When a new SW is found & installed, prepare reload
              reg.addEventListener('updatefound', () => {
                const installingWorker = reg.installing;
                if (installingWorker) {
                  installingWorker.addEventListener('statechange', () => {
                    if (installingWorker.state === 'installed' && navigator.serviceWorker.controller) {
                      console.log('[PWA] New version ready. Applying update...');
                    }
                  });
                }
              });
            })
            .catch((err) => {
              console.warn('[PWA] Service Worker registration failed:', err);
            });

          // Smoothly reload once the new Service Worker activates and claims clients
          let isRefreshing = false;
          navigator.serviceWorker.addEventListener('controllerchange', () => {
            if (!isRefreshing) {
              isRefreshing = true;
              console.log('[PWA] Controller changed, reloading to display latest version.');
              window.location.reload();
            }
          });
        });
      }
    </script>
  </body>
