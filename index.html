    <!-- PWA Self-Healing: Stale Chunk & MIME Error Recovery (Targeted only, no false reloads) -->
    <script>
      window.addEventListener('error', function(event) {
        var msg = (event && event.message) || '';
        var isMimeOrChunk = msg.indexOf('MIME type') !== -1 ||
                            msg.indexOf('Failed to load module script') !== -1 ||
                            msg.indexOf('Loading chunk') !== -1 ||
                            msg.indexOf('dynamically imported module') !== -1;
        if (isMimeOrChunk) {
          console.warn('[PWA Self-Healing] Stale chunk load error detected:', msg);
          var healKey = 'kisan_sw_healed_' + Math.floor(Date.now() / 60000);
          if (!sessionStorage.getItem(healKey)) {
            sessionStorage.setItem(healKey, '1');
            if ('caches' in window) {
              caches.keys().then(function(names) {
                return Promise.all(names.map(function(name) { return caches.delete(name); }));
              }).then(function() {
                if ('serviceWorker' in navigator) {
                  navigator.serviceWorker.getRegistrations().then(function(regs) {
                    regs.forEach(function(r) { r.unregister(); });
                    window.location.reload();
                  });
                } else {
                  window.location.reload();
                }
              });
            } else {
              window.location.reload();
            }
          }
        }
      });
    </script>

    <!-- Service Worker Registration with First-Load Preservation & Smooth Update -->
    <script>
      if ('serviceWorker' in navigator) {
        // Track whether an existing controller was already running on initial page load
        var hadControllerOnLoad = Boolean(navigator.serviceWorker.controller);

        window.addEventListener('load', function() {
          navigator.serviceWorker.register('/sw.js', { updateViaCache: 'none' })
            .then(function(reg) {
              if (reg && typeof reg.update === 'function') {
                reg.update().catch(function(e) {
                  // Non-fatal background check error (e.g. offline or Cloudflare challenge)
                  console.debug('[PWA] SW update check deferred:', e);
                });
              }

              reg.addEventListener('updatefound', function() {
                var installingWorker = reg.installing;
                if (installingWorker) {
                  installingWorker.addEventListener('statechange', function() {
                    if (installingWorker.state === 'installed' && navigator.serviceWorker.controller) {
                      console.log('[PWA] New version ready.');
                    }
                  });
                }
              });
            })
            .catch(function(err) {
              console.warn('[PWA] Service Worker registration failed:', err);
            });

          // Reload ONLY when an existing active SW was replaced by an update.
          // NEVER reload on the first visit, preventing FCP cancellations in Lighthouse.
          var isRefreshing = false;
          navigator.serviceWorker.addEventListener('controllerchange', function() {
            if (!hadControllerOnLoad) {
              // First visit installation: do NOT reload
              return;
            }
            if (!isRefreshing) {
              isRefreshing = true;
              console.log('[PWA] Controller updated, reloading for latest assets.');
              window.location.reload();
            }
          });
        });
      }
    </script>
