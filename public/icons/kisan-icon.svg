<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1b5e20"/>
      <stop offset="50%" stop-color="#2e7d32"/>
      <stop offset="100%" stop-color="#388e3c"/>
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fff176"/>
      <stop offset="50%" stop-color="#fbc02d"/>
      <stop offset="100%" stop-color="#f57f17"/>
    </linearGradient>
    <linearGradient id="sunGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffe082"/>
      <stop offset="100%" stop-color="#ffb300"/>
    </linearGradient>
  </defs>

  <!-- Background circle with smooth corners -->
  <rect width="512" height="512" rx="110" fill="url(#bgGrad)"/>
  
  <!-- Outer glowing ring -->
  <rect x="16" y="16" width="480" height="480" rx="98" fill="none" stroke="rgba(255,255,255,0.18)" stroke-width="6"/>

  <!-- Rising Sun in Background -->
  <circle cx="256" cy="210" r="88" fill="url(#sunGrad)" opacity="0.85"/>
  
  <!-- Sun rays -->
  <g stroke="url(#sunGrad)" stroke-width="5" stroke-linecap="round" opacity="0.6">
    <line x1="256" y1="95" x2="256" y2="70"/>
    <line x1="337" y1="128" x2="355" y2="110"/>
    <line x1="371" y1="210" x2="396" y2="210"/>
    <line x1="175" y1="128" x2="157" y2="110"/>
    <line x1="141" y1="210" x2="116" y2="210"/>
  </g>

  <!-- Fertile Land / Furrows (Khet) -->
  <path d="M40 430 C120 370, 200 370, 256 390 C312 410, 392 410, 472 350 L472 472 C472 494, 454 512, 432 512 L80 512 C58 512, 40 494, 40 472 Z" fill="#1b5e20" opacity="0.95"/>
  <path d="M40 460 C140 415, 240 425, 300 440 C360 455, 410 445, 472 410 L472 512 L80 512 Z" fill="#144417"/>

  <!-- Golden Wheat / Paddy Stalk (धान की बाली) -->
  <g fill="url(#goldGrad)" stroke="#c67d00" stroke-width="2">
    <!-- Center Stem -->
    <path d="M256 160 Q254 280 256 420" stroke="url(#goldGrad)" stroke-width="8" stroke-linecap="round" fill="none"/>
    
    <!-- Top Grain -->
    <path d="M256 140 C265 155, 265 175, 256 185 C247 175, 247 155, 256 140 Z"/>
    
    <!-- Grain Left 1 -->
    <path d="M252 175 C232 170, 218 190, 230 205 C245 208, 254 195, 252 175 Z"/>
    <!-- Grain Right 1 -->
    <path d="M260 175 C280 170, 294 190, 282 205 C267 208, 258 195, 260 175 Z"/>

    <!-- Grain Left 2 -->
    <path d="M250 205 C222 200, 206 225, 222 242 C239 245, 252 230, 250 205 Z"/>
    <!-- Grain Right 2 -->
    <path d="M262 205 C290 200, 306 225, 290 242 C273 245, 260 230, 262 205 Z"/>

    <!-- Grain Left 3 -->
    <path d="M248 240 C215 235, 195 265, 215 285 C235 288, 250 270, 248 240 Z"/>
    <!-- Grain Right 3 -->
    <path d="M264 240 C297 235, 317 265, 297 285 C277 288, 262 270, 264 240 Z"/>

    <!-- Grain Left 4 -->
    <path d="M248 280 C210 275, 190 310, 212 330 C234 332, 250 312, 248 280 Z"/>
    <!-- Grain Right 4 -->
    <path d="M264 280 C302 275, 322 310, 300 330 C278 332, 262 312, 264 280 Z"/>
  </g>

  <!-- Green Sprout Leaves on Base -->
  <path d="M254 350 C210 320, 160 340, 150 390 C180 395, 230 380, 254 350 Z" fill="#66bb6a" stroke="#2e7d32" stroke-width="2"/>
  <path d="M258 350 C302 320, 352 340, 362 390 C332 395, 282 380, 258 350 Z" fill="#81c784" stroke="#2e7d32" stroke-width="2"/>

  <!-- Text Badge "किसान साथी" at bottom -->
  <rect x="126" y="440" width="260" height="44" rx="22" fill="#ffffff" opacity="0.95"/>
  <text x="256" y="470" font-family="'Segoe UI', Roboto, sans-serif" font-size="24" font-weight="bold" fill="#1b5e20" text-anchor="middle">किसान साथी</text>
</svg>
