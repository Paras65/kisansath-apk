name: 📱 Build & Release Native Android APK

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write
  actions: write

env:
  NODE_VERSION: '20'
  JAVA_VERSION: '21'
  APK_FILENAME: ${{ vars.APK_FILENAME || 'kisan-saathi.apk' }}
  VITE_API_BASE_URL: ${{ vars.VITE_API_BASE_URL || 'https://kisan-saathi-api-4sdo.onrender.com/api' }}
  VITE_APP_HOST: ${{ vars.VITE_APP_HOST || 'https://kisan.init65.co.in' }}

jobs:
  build-apk:
    name: 🏗️ Compile & Release Android APK
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Checkout Repository
        uses: actions/checkout@v4

      - name: 🔍 Extract App Metadata Dynamically
        id: meta
        run: |
          APP_NAME=$(node -e "const fs=require('fs'); const cap=fs.existsSync('capacitor.config.json')?JSON.parse(fs.readFileSync('capacitor.config.json','utf8')):{}; const pkg=fs.existsSync('package.json')?JSON.parse(fs.readFileSync('package.json','utf8')):{}; console.log(cap.appName || pkg.name || 'Native App');")
          APP_ID=$(node -e "const fs=require('fs'); const cap=fs.existsSync('capacitor.config.json')?JSON.parse(fs.readFileSync('capacitor.config.json','utf8')):{}; console.log(cap.appId || 'com.app.native');")
          APP_VER=$(node -e "const fs=require('fs'); const pkg=fs.existsSync('package.json')?JSON.parse(fs.readFileSync('package.json','utf8')):{}; console.log(pkg.version || '1.0.0');")
          echo "app_name=$APP_NAME" >> "$GITHUB_OUTPUT"
          echo "app_id=$APP_ID" >> "$GITHUB_OUTPUT"
          echo "app_ver=$APP_VER" >> "$GITHUB_OUTPUT"

      - name: ☕ Setup Java JDK ${{ env.JAVA_VERSION }}
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: ${{ env.JAVA_VERSION }}
          cache: 'gradle'

      - name: 🟢 Setup Node.js ${{ env.NODE_VERSION }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: 📦 Install Dependencies
        run: npm install

      - name: 🔨 Build Web Application
        run: npm run build

      - name: 📱 Add & Sync Capacitor Android
        run: |
          npx cap add android || true
          npx cap sync android

      - name: 🛠️ Run Custom Android Configuration (If Present)
        run: |
          if [ -f "scripts/configure-android.js" ]; then
            node scripts/configure-android.js
          fi

      - name: 🔑 Build Native Android APK via Gradle
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

          mkdir -p ../output-apk
          cp app/build/outputs/apk/debug/app-debug.apk "../output-apk/${APK_FILENAME}"

      - name: 🧹 Purge Old Actions Artifacts (Free Storage Quota to 0 MB)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh api repos/${{ github.repository }}/actions/artifacts --paginate -q '.artifacts[].id' | while read -r id; do
            if [ -n "$id" ]; then
              echo "Deleting old artifact ID: $id"
              gh api -X DELETE "repos/${{ github.repository }}/actions/artifacts/$id" || true
            fi
          done

      - name: 🚀 Publish APK to GitHub Releases
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ startsWith(github.ref, 'refs/tags/v') && github.ref_name || format('v{0}-latest', steps.meta.outputs.app_ver) }}
          name: ${{ format('📱 {0} v{1} — Native Android APK', steps.meta.outputs.app_name, steps.meta.outputs.app_ver) }}
          files: output-apk/${{ env.APK_FILENAME }}
          draft: false
          prerelease: false
          make_latest: true
          generate_release_notes: true
          body: |
            ## 📱 ${{ steps.meta.outputs.app_name }} (v${{ steps.meta.outputs.app_ver }}) — Native Android APK
            
            - **Package ID:** `${{ steps.meta.outputs.app_id }}`
            - **Version:** `v${{ steps.meta.outputs.app_ver }}`
            - **Engine:** `@capacitor/android` Native Bridge
            
            ### 📥 Direct APK Download:
            - Download **`${{ env.APK_FILENAME }}`** from the Assets section below and install directly on your Android device.
