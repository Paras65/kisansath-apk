name: 📱 Build Kisan Saathi Native Android APK

on:
  push:
    branches:
      - main
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-apk:
    name: 🏗️ Compile Native Android APK (Capacitor)
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Checkout Repository
        uses: actions/checkout@v4

      - name: ☕ Setup Java JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: 🟢 Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: 📦 Install Dependencies
        run: npm install

      - name: 🔨 Build Web Application
        run: npm run build

      - name: 📱 Add & Sync Capacitor Android
        run: |
          npx cap add android || true
          npx cap sync android

      - name: 🛠️ Configure Android 3D Icons & Module Permissions
        run: node scripts/configure-android.js

      - name: 🔑 Build Native Android APK via Gradle
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug

          # Prepare output folder
          mkdir -p ../output-apk
          cp app/build/outputs/apk/debug/app-debug.apk ../output-apk/kisan-saathi.apk
          cp app/build/outputs/apk/debug/app-debug.apk ../output-apk/kisan-saathi-native.apk

      - name: 📤 Upload Build Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: kisan-saathi-native-apk
          path: output-apk/*.apk

      - name: 🚀 Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ startsWith(github.ref, 'refs/tags/v') && github.ref_name || 'v1.0.0-latest' }}
          name: ${{ startsWith(github.ref, 'refs/tags/v') && format('Release {0} - किसान साथी Native Android APK', github.ref_name) || '📱 किसान साथी Native Android APK (100% Real App)' }}
          files: output-apk/*.apk
          draft: false
          prerelease: false
          make_latest: true
          generate_release_notes: true
          body: |
            ## 🌾 किसान साथी Native Android App (100% Real Android APK)
            
            - **इंजन:** `@capacitor/android` Native Bridge
            - **पैकेज आईडी:** `in.co.init65.kisan`
            - **फीचर्स:**
              - 🚫 **कोई ब्राउज़र URL बार नहीं:** शुद्ध फुल-स्क्रीन असली ऐप अनुभव
              - 🚀 **100% नेटिव फील:** हार्डवेयर बैक बटन, स्टेटस बार थीम (`#1b5e20`)
              - 🎨 **प्रीमियम 3D आइकॉन:** सोने की बाली व एमराल्ड पत्ती
              - ⚡ **ऑफलाइन सक्षम:** बिना इंटरनेट के भी सुपरफ़ास्ट
            
            ### 📥 डाउनलोड लिंक:
            - नीचे दी गई `kisan-saathi.apk` सीधे अपने Android फोन में इंस्टॉल करें।
